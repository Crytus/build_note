name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit tests (Python ${{ matrix.python-version }})
    # OSは明示的に固定する。ubuntu-latest は Ubuntu 26.04 に移行しており、
    # そこには Python 3.9 のビルドが無いため setup-python が失敗する。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.9",  os: ubuntu-22.04 }   # README で謳う下限
          - { python-version: "3.12", os: ubuntu-24.04 }
          - { python-version: "3.13", os: ubuntu-24.04 }
          - { python-version: "3.14", os: ubuntu-24.04 }   # 現行

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show version
        run: python --version

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test (convert the example and inspect the output)
        run: |
          python build_note.py examples/example.md -o /tmp/out.md --check /tmp/check.html
          test -s /tmp/out.md
          test -s /tmp/check.html
          grep -q 'begin{array}' /tmp/out.md          # 表が KaTeX に変換されている
          ! grep -qE '^\|.*\|$' /tmp/out.md           # Markdown の表が残っていない
          grep -q 'window.__r' /tmp/check.html        # 検証HTMLが生成されている

      - name: Fail if the working tree is dirty
        run: git diff --exit-code
